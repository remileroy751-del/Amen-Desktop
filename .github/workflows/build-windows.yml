name: Build AMEN CONNECT Admin (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compiler l'application Windows
    runs-on: windows-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install

      - name: Compiler l'installateur Windows
        run: npm run dist

      - name: Publier les exécutables (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: AMEN-CONNECT-Admin-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Créer une Release (si tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
